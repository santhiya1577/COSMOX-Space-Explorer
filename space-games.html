
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>COSMOX - Space Runner</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#01030d;
    color:white;
    font-family:Arial,sans-serif;
}

/* SPACE */

#space{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 50%,#081633 0%,#020617 45%,#000 100%);
}

/* STARS */

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    box-shadow:0 0 6px white;
    animation:starMove linear infinite;
}

@keyframes starMove{
    from{
        transform:translateY(-20px);
    }
    to{
        transform:translateY(110vh);
    }
}

/* HEADER */

header{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:65px;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
    background:rgba(0,0,20,.65);
    border-bottom:1px solid #00eaff;
}

.logo{
    color:#00eaff;
    font-size:25px;
    font-weight:bold;
    text-shadow:0 0 15px #00eaff;
}

.back{
    text-decoration:none;
    color:#00eaff;
    border:1px solid #00eaff;
    padding:9px 18px;
    border-radius:20px;
}

.back:hover{
    background:#00eaff;
    color:#001018;
}

/* HUD */

#hud{
    position:absolute;
    top:80px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:12px;
    z-index:15;
}

.hud{
    min-width:100px;
    text-align:center;
    padding:9px 15px;
    border:1px solid #00eaff;
    border-radius:12px;
    background:#031225cc;
    box-shadow:0 0 12px #00eaff44;
}

/* PLAYER */

#player{
    position:absolute;
    width:70px;
    height:70px;
    bottom:60px;
    left:50%;
    transform:translateX(-50%);
    z-index:8;
    transition:.08s;
}

/* spaceship body */

.ship{
    position:absolute;
    left:10px;
    top:5px;
    width:50px;
    height:55px;
    background:linear-gradient(90deg,#009dff,#00eaff,#008cff);
    clip-path:polygon(50% 0%,100% 100%,50% 75%,0% 100%);
    filter:drop-shadow(0 0 15px #00eaff);
    animation:shipFloat .5s infinite alternate;
}

@keyframes shipFloat{
    from{transform:translateY(0)}
    to{transform:translateY(-5px)}
}

.window{
    position:absolute;
    width:15px;
    height:15px;
    left:27px;
    top:22px;
    background:white;
    border-radius:50%;
    box-shadow:0 0 15px white;
    z-index:2;
}

.flame{
    position:absolute;
    width:15px;
    height:28px;
    left:27px;
    top:52px;
    background:orange;
    border-radius:50%;
    box-shadow:0 0 20px orange;
    animation:flame .1s infinite alternate;
}

@keyframes flame{
    from{height:12px}
    to{height:30px}
}

/* OBSTACLES */

.asteroid{
    position:absolute;
    width:50px;
    height:50px;
    background:#697586;
    border-radius:45% 55% 60% 40%;
    box-shadow:0 0 12px #64748b;
    animation:rotate 1s linear infinite;
}

@keyframes rotate{
    to{transform:rotate(360deg)}
}

/* PLANET */

.planet{
    position:absolute;
    width:90px;
    height:90px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#ffdd88,#ff7b00,#9d2600);
    box-shadow:0 0 35px #ff6500;
}

.planet:after{
    content:"";
    position:absolute;
    width:125px;
    height:30px;
    border:6px solid #ffb347;
    border-radius:50%;
    top:30px;
    left:-18px;
    transform:rotate(-15deg);
}

/* ALIEN */

.alien{
    position:absolute;
    width:65px;
    height:55px;
    background:#a855f7;
    border-radius:50%;
    box-shadow:0 0 25px #a855f7;
    animation:alienMove 1s infinite alternate;
}

.alien:before,
.alien:after{
    content:"";
    position:absolute;
    width:12px;
    height:18px;
    background:white;
    border-radius:50%;
    top:15px;
}

.alien:before{left:14px}
.alien:after{right:14px}

@keyframes alienMove{
    from{transform:translateX(-20px)}
    to{transform:translateX(20px)}
}

/* LASER */

.laser{
    position:absolute;
    width:6px;
    height:30px;
    background:#00ff9d;
    box-shadow:0 0 18px #00ff9d;
    border-radius:5px;
}

/* ENEMY LASER */

.enemyLaser{
    position:absolute;
    width:7px;
    height:25px;
    background:#ff3158;
    box-shadow:0 0 15px #ff3158;
}

/* EXPLOSION */

.explosion{
    position:absolute;
    width:60px;
    height:60px;
    border:5px solid #ffe600;
    border-radius:50%;
    animation:boom .5s forwards;
}

@keyframes boom{
    0%{
        transform:scale(.2);
        opacity:1;
    }
    100%{
        transform:scale(2.5);
        opacity:0;
    }
}

/* LEVEL SCREEN */

#levelScreen{
    position:absolute;
    inset:0;
    z-index:30;
    background:#000b;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

#levelScreen h1{
    font-size:55px;
    color:#00eaff;
    text-shadow:0 0 30px #00eaff;
    animation:levelGlow 1s infinite alternate;
}

@keyframes levelGlow{
    from{transform:scale(1)}
    to{transform:scale(1.1)}
}

#levelScreen p{
    margin-top:15px;
    color:#cbd5e1;
}

/* START */

#start{
    position:absolute;
    inset:0;
    z-index:40;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,15,.93);
    text-align:center;
}

#start h1{
    font-size:50px;
    color:#00eaff;
    text-shadow:0 0 30px #00eaff;
}

#start p{
    margin:20px;
    line-height:1.8;
    color:#cbd5e1;
}

button{
    padding:14px 35px;
    border:none;
    border-radius:30px;
    background:#00eaff;
    color:#001018;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    transform:scale(1.08);
    box-shadow:0 0 30px #00eaff;
}

/* GAME OVER */

#gameOver{
    position:absolute;
    inset:0;
    z-index:50;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:#000d;
}

#gameOver h1{
    font-size:50px;
    color:#ff3158;
    text-shadow:0 0 25px #ff3158;
}

/* MOBILE */

#mobile{
    display:none;
    position:absolute;
    bottom:15px;
    width:100%;
    justify-content:center;
    gap:15px;
    z-index:20;
}

.mobileBtn{
    width:65px;
    height:50px;
    padding:0;
    background:#031a2d;
    color:#00eaff;
    border:1px solid #00eaff;
}

@media(max-width:600px){

    header{
        padding:0 12px;
    }

    .logo{
        font-size:19px;
    }

    .back{
        font-size:12px;
        padding:7px 12px;
    }

    #hud{
        top:75px;
        gap:5px;
    }

    .hud{
        min-width:auto;
        padding:7px 9px;
        font-size:12px;
    }

    #start h1{
        font-size:32px;
    }

    #levelScreen h1{
        font-size:38px;
    }

    #mobile{
        display:flex;
    }
}
</style>
</head>

<body>

<div id="space">

<header>
    <div class="logo">COSMOX 🚀</div>
    <a href="dashboard.html" class="back">← Dashboard</a>
</header>

<!-- HUD -->

<div id="hud">

    <div class="hud">
        ⭐ <span id="score">0</span>
    </div>

    <div class="hud">
        ❤️ <span id="lives">3</span>
    </div>

    <div class="hud">
        LEVEL <span id="level">1</span>
    </div>

</div>


<!-- START SCREEN -->

<div id="start">

    <h1>🚀 COSMOX SPACE RUNNER</h1>

    <p>
        🌌 SURVIVE THE UNIVERSE 🌌
        <br><br>

        Level 1 → Star Tunnel ⭐
        <br>
        Level 2 → Planet Zone 🪐
        <br>
        Level 3 → Alien Boss 👾
        <br><br>

        ⬅️ ➡️ Move &nbsp;&nbsp; SPACE → Shoot
    </p>

    <button onclick="startGame()">
        START MISSION 🚀
    </button>

</div>


<!-- LEVEL SCREEN -->

<div id="levelScreen" style="display:none">

    <h1 id="levelTitle">
        LEVEL 1
    </h1>

    <p id="levelText">
        STAR TUNNEL
    </p>

</div>


<!-- PLAYER -->

<div id="player">

    <div class="ship"></div>

    <div class="window"></div>

    <div class="flame"></div>

</div>


<!-- MOBILE CONTROLS -->

<div id="mobile">

    <button class="mobileBtn"
        onclick="moveLeft()">⬅️</button>

    <button class="mobileBtn"
        onclick="shoot()">🔥</button>

    <button class="mobileBtn"
        onclick="moveRight()">➡️</button>

</div>


<!-- GAME OVER -->

<div id="gameOver">

    <h1>MISSION FAILED 💥</h1>

    <p id="finalText">
        Score: 0
    </p>

    <br>

    <button onclick="startGame()">
        PLAY AGAIN 🚀
    </button>

</div>

</div>


<script>

/* ==============================
   STARS
============================== */

for(let i=0;i<150;i++){

    let star=document.createElement("div");

    star.className="star";

    star.style.left=Math.random()*100+"%";

    star.style.top=Math.random()*100+"%";

    star.style.animationDuration=
        (1+Math.random()*4)+"s";

    star.style.animationDelay=
        Math.random()*4+"s";

    document.getElementById("space")
        .appendChild(star);
}


/* ==============================
   VARIABLES
============================== */

const space=document.getElementById("space");
const player=document.getElementById("player");

let score=0;
let lives=3;
let level=1;

let playerX=window.innerWidth/2;

let objects=[];
let lasers=[];
let enemyLasers=[];

let playing=false;


/* ==============================
   START
============================== */

function startGame(){

    score=0;
    lives=3;
    level=1;

    objects.forEach(o=>o.remove());
    lasers.forEach(l=>l.remove());
    enemyLasers.forEach(l=>l.remove());

    objects=[];
    lasers=[];
    enemyLasers=[];

    document.getElementById("score").innerText=score;
    document.getElementById("lives").innerText=lives;
    document.getElementById("level").innerText=level;

    document.getElementById("start")
        .style.display="none";

    document.getElementById("gameOver")
        .style.display="none";

    playerX=window.innerWidth/2;

    player.style.left=playerX+"px";

    playing=true;

    showLevel(1);
}


/* ==============================
   LEVEL SCREEN
============================== */

function showLevel(n){

    playing=false;

    let screen=document.getElementById("levelScreen");

    let title=document.getElementById("levelTitle");

    let text=document.getElementById("levelText");

    if(n===1){

        title.innerText="LEVEL 1 ⭐";

        text.innerText=
            "STAR TUNNEL — SURVIVE!";

    }

    if(n===2){

        title.innerText="LEVEL 2 🪐";

        text.innerText=
            "PLANET ZONE — DODGE!";

    }

    if(n===3){

        title.innerText="LEVEL 3 👾";

        text.innerText=
            "ALIEN BOSS — DEFEAT IT!";

    }

    screen.style.display="flex";

    setTimeout(()=>{

        screen.style.display="none";

        playing=true;

    },1800);
}


/* ==============================
   MOVEMENT
============================== */

function moveLeft(){

    if(!playing)return;

    playerX-=35;

    if(playerX<35)
        playerX=35;

    player.style.left=
        playerX+"px";
}


function moveRight(){

    if(!playing)return;

    playerX+=35;

    if(playerX>window.innerWidth-35)
        playerX=window.innerWidth-35;

    player.style.left=
        playerX+"px";
}


/* ==============================
   KEYBOARD
============================== */

document.addEventListener("keydown",e=>{

    if(!playing)return;

    if(e.key==="ArrowLeft" ||
       e.key.toLowerCase()==="a")
        moveLeft();

    if(e.key==="ArrowRight" ||
       e.key.toLowerCase()==="d")
        moveRight();

    if(e.code==="Space"){

        e.preventDefault();

        shoot();
    }

});


/* ==============================
   SHOOT
============================== */

function shoot(){

    if(!playing)return;

    let laser=document.createElement("div");

    laser.className="laser";

    laser.style.left=
        (playerX-3)+"px";

    laser.style.top=
        (player.offsetTop-25)+"px";

    space.appendChild(laser);

    lasers.push(laser);
}


/* ==============================
   CREATE OBJECT
============================== */

function createObject(){

    if(!playing)return;


    let obj=document.createElement("div");


    /* LEVEL 1 */

    if(level===1){

        obj.className="asteroid";

    }


    /* LEVEL 2 */

    if(level===2){

        obj.className=
            Math.random()>0.5
            ?"asteroid"
            :"planet";

    }


    /* LEVEL 3 */

    if(level===3){

        obj.className="asteroid";

    }


    obj.style.left=
        Math.random()*(window.innerWidth-100)+"px";

    obj.style.top="-100px";

    space.appendChild(obj);

    objects.push(obj);
}


/* ==============================
   EXPLOSION
============================== */

function explosion(x,y){

    let e=document.createElement("div");

    e.className="explosion";

    e.style.left=x+"px";

    e.style.top=y+"px";

    space.appendChild(e);

    setTimeout(()=>{
        e.remove();
    },500);
}


/* ==============================
   COLLISION
============================== */

function hit(a,b){

    let A=a.getBoundingClientRect();
    let B=b.getBoundingClientRect();

    return !(
        A.right<B.left ||
        A.left>B.right ||
        A.bottom<B.top ||
        A.top>B.bottom
    );
}


/* ==============================
   BOSS
============================== */

let boss=null;
let bossHealth=20;

function createBoss(){

    if(boss)return;

    boss=document.createElement("div");

    boss.className="alien";

    boss.style.left=
        (window.innerWidth/2-30)+"px";

    boss.style.top="130px";

    space.appendChild(boss);

    bossHealth=20;
}


/* ==============================
   BOSS ATTACK
============================== */

function bossAttack(){

    if(level!==3 ||
       !playing ||
       !boss)return;

    let laser=document.createElement("div");

    laser.className="enemyLaser";

    laser.style.left=
        (boss.offsetLeft+30)+"px";

    laser.style.top=
        (boss.offsetTop+50)+"px";

    space.appendChild(laser);

    enemyLasers.push(laser);
}


/* ==============================
   MAIN LOOP
============================== */

function loop(){

    if(playing){

        /* LASERS */

        for(let i=lasers.length-1;i>=0;i--){

            let l=lasers[i];

            l.style.top=
                (l.offsetTop-14)+"px";


            if(l.offsetTop<-40){

                l.remove();

                lasers.splice(i,1);

                continue;
            }


            /* LASER VS OBJECT */

            for(let j=objects.length-1;j>=0;j--){

                let o=objects[j];

                if(hit(l,o)){

                    explosion(
                        o.offsetLeft,
                        o.offsetTop
                    );

                    o.remove();

                    l.remove();

                    objects.splice(j,1);

                    lasers.splice(i,1);

                    score+=10;

                    document.getElementById("score")
                        .innerText=score;

                    checkLevel();

                    break;
                }
            }


            /* LASER VS BOSS */

            if(level===3 && boss){

                if(hit(l,boss)){

                    l.remove();

                    lasers.splice(i,1);

                    bossHealth--;

                    score+=5;

                    document.getElementById("score")
                        .innerText=score;

                    explosion(
                        boss.offsetLeft+
                        Math.random()*50,
                        boss.offsetTop+
                        Math.random()*40
                    );

                    if(bossHealth<=0){

                        explosion(
                            boss.offsetLeft,
                            boss.offsetTop
                        );

                        boss.remove();

                        boss=null;

                        setTimeout(()=>{
                            winGame();
                        },700);
                    }
                }
            }
        }


        /* OBJECTS */

        for(let i=objects.length-1;i>=0;i--){

            let o=objects[i];

            let speed=
                3+(level*1.2);

            o.style.top=
                (o.offsetTop+speed)+"px";


            if(hit(o,player)){

                explosion(
                    o.offsetLeft,
                    o.offsetTop
                );

                o.remove();

                objects.splice(i,1);

                loseLife();

                continue;
            }


            if(o.offsetTop>
               window.innerHeight){

                o.remove();

                objects.splice(i,1);
            }
        }


        /* BOSS LASERS */

        for(let i=enemyLasers.length-1;i>=0;i--){

            let l=enemyLasers[i];

            l.style.top=
                (l.offsetTop+8)+"px";


            if(hit(l,player)){

                l.remove();

                enemyLasers.splice(i,1);

                loseLife();

                continue;
            }


            if(l.offsetTop>
               window.innerHeight){

                l.remove();

                enemyLasers.splice(i,1);
            }
        }
    }

    requestAnimationFrame(loop);
}


/* ==============================
   LOSE LIFE
============================== */

function loseLife(){

    lives--;

    document.getElementById("lives")
        .innerText=lives;

    player.style.transform=
        "translateX(-50%) scale(1.3)";

    setTimeout(()=>{

        player.style.transform=
            "translateX(-50%) scale(1)";

    },150);


    if(lives<=0){

        gameOver();
    }
}


/* ==============================
   LEVEL CHECK
============================== */

function checkLevel(){

    if(level===1 && score>=100){

        level=2;

        document.getElementById("level")
            .innerText=level;

        showLevel(2);
    }


    else if(level===2 && score>=250){

        level=3;

        document.getElementById("level")
            .innerText=level;

        showLevel(3);

        setTimeout(()=>{
            createBoss();
        },1900);
    }
}


/* ==============================
   GAME OVER
============================== */

function gameOver(){

    playing=false;

    document.getElementById("finalText")
        .innerText=
        "Final Score: "+score;

    document.getElementById("gameOver")
        .style.display="flex";
}


/* ==============================
   WIN
============================== */

function winGame(){

    playing=false;

    document.getElementById("finalText")
        .innerText=
        "🏆 ALL 3 LEVELS COMPLETED! Score: "+score;

    document.querySelector("#gameOver h1")
        .innerText="🚀 GALAXY SAVED!";

    document.getElementById("gameOver")
        .style.display="flex";
}


/* ==============================
   SPAWN
============================== */

setInterval(()=>{

    if(playing){

        if(level<3){

            createObject();

        }
        else{

            createObject();

        }

    }

},700);


/* ==============================
   BOSS SHOOT
============================== */

setInterval(()=>{

    bossAttack();

},900);


/* ==============================
   LOOP
============================== */

loop();

</script>

</body>
</html>
