
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>COSMOX - Solar System</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #020617;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ================= STARS ================= */

        .stars {
            position: fixed;
            inset: 0;

            background:
                radial-gradient(circle at 10% 20%, white 1px, transparent 2px),
                radial-gradient(circle at 30% 70%, white 1px, transparent 2px),
                radial-gradient(circle at 50% 30%, white 1px, transparent 2px),
                radial-gradient(circle at 70% 80%, white 1px, transparent 2px),
                radial-gradient(circle at 90% 40%, white 1px, transparent 2px);

            background-size: 180px 180px;

            opacity: 0.5;

            pointer-events: none;

            z-index: 1;
        }


        /* ================= HEADER ================= */

        header {
            position: relative;

            text-align: center;

            padding: 20px;

            z-index: 100;
        }

        header h1 {
            font-size: 32px;

            color: #7dd3fc;

            text-shadow:
                0 0 10px #38bdf8,
                0 0 25px #38bdf8;
        }

        header p {
            margin-top: 8px;

            color: #94a3b8;
        }


        /* ================= BACK BUTTON ================= */

        .back-btn {

            position: fixed;

            top: 20px;
            left: 20px;

            padding: 10px 18px;

            border: 1px solid #38bdf8;

            border-radius: 20px;

            background: rgba(2, 6, 23, 0.95);

            color: #7dd3fc;

            cursor: pointer;

            z-index: 500;

            font-size: 14px;
        }

        .back-btn:hover {
            background: #0ea5e9;
            color: white;
        }


        /* ================= SOLAR SYSTEM ================= */

        .solar-system {

            position: relative;

            width: 800px;

            height: 560px;

            margin: 0 auto;

            z-index: 10;
        }


        /* ================= SUN ================= */

        .sun {

            position: absolute;

            width: 85px;
            height: 85px;

            left: 357px;
            top: 235px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    #fff7ae,
                    #ffcc33,
                    #ff7b00
                );

            box-shadow:
                0 0 25px #ffcc33,
                0 0 60px #ff9900,
                0 0 100px #ff6600;

            cursor: pointer;

            z-index: 300;

            transition: transform 0.3s;
        }

        .sun:hover {
            transform: scale(1.15);
        }


        /* ================= ORBIT ================= */

        .orbit {

            position: absolute;

            left: 50%;
            top: 50%;

            border: 1px solid rgba(255,255,255,0.18);

            border-radius: 50%;

            transform: translate(-50%, -50%);

            z-index: 20;

            /* Orbit itself must not block planet clicks */
            pointer-events: none;

            animation-name: orbitRotate;

            animation-timing-function: linear;

            animation-iteration-count: infinite;
        }


        .orbit1 {
            width: 150px;
            height: 150px;

            animation-duration: 8s;
        }

        .orbit2 {
            width: 220px;
            height: 220px;

            animation-duration: 12s;
        }

        .orbit3 {
            width: 290px;
            height: 290px;

            animation-duration: 16s;
        }

        .orbit4 {
            width: 360px;
            height: 360px;

            animation-duration: 20s;
        }

        .orbit5 {
            width: 430px;
            height: 430px;

            animation-duration: 25s;
        }

        .orbit6 {
            width: 500px;
            height: 500px;

            animation-duration: 30s;
        }

        .orbit7 {
            width: 570px;
            height: 570px;

            animation-duration: 35s;
        }

        .orbit8 {
            width: 640px;
            height: 640px;

            animation-duration: 40s;
        }


        @keyframes orbitRotate {

            from {
                transform:
                    translate(-50%, -50%)
                    rotate(0deg);
            }

            to {
                transform:
                    translate(-50%, -50%)
                    rotate(360deg);
            }

        }


        /* ================= PLANETS ================= */

        .planet {

            position: absolute;

            top: -15px;

            left: 50%;

            transform: translateX(-50%);

            border-radius: 50%;

            cursor: pointer;

            z-index: 400;

            pointer-events: auto;

            transition: transform 0.25s;

            /* Keep every planet above the orbit layers */
            isolation: isolate;

            /* Remove browser button styling */
            border: none;
            outline: none;
            padding: 0;
        }


        .planet:hover {

            transform:
                translateX(-50%)
                scale(1.3);

        }


        /* ================= MERCURY ================= */

        .mercury {

            width: 30px;
            height: 30px;

            background:
                radial-gradient(
                    circle at 30% 30%,
                    #eeeeee,
                    #777777
                );

            box-shadow:
                0 0 15px #aaaaaa;
        }


        /* ================= VENUS ================= */

        .venus {

            width: 40px;
            height: 40px;

            background:
                radial-gradient(
                    circle at 30% 30%,
                    #ffe4a3,
                    #c87820
                );

            box-shadow:
                0 0 18px #f5b642;
        }


        /* ================= EARTH ================= */

        .earth {

            width: 46px;
            height: 46px;

            overflow: hidden;

            background: #2563eb;

            box-shadow:
                0 0 20px #38bdf8;
        }

        .earth img {

            width: 100%;
            height: 100%;

            object-fit: cover;

            border-radius: 50%;

            pointer-events: none;

            display: block;
        }


        /* ================= MARS ================= */

        .mars {

            width: 38px;
            height: 38px;

            background:
                radial-gradient(
                    circle at 30% 30%,
                    #ff8066,
                    #9f2d1e
                );

            box-shadow:
                0 0 18px #ef4444;
        }


        /* ================= JUPITER ================= */

        .jupiter {

            width: 65px;
            height: 65px;

            background:
                repeating-linear-gradient(
                    0deg,
                    #d8b08c 0px,
                    #f0d0a8 8px,
                    #b9784f 14px,
                    #e8c39e 20px
                );

            box-shadow:
                0 0 20px #d6a36c;
        }


        /* ================= SATURN ================= */

        .saturn {

            width: 56px;
            height: 56px;

            background:
                radial-gradient(
                    circle at 30% 30%,
                    #f5d9a6,
                    #b58b55
                );

            box-shadow:
                0 0 20px #e5c07b;
        }


        .saturn::after {

            content: "";

            position: absolute;

            width: 95px;
            height: 26px;

            border:
                4px solid
                rgba(220,190,140,0.8);

            border-radius: 50%;

            top: 15px;
            left: -20px;

            transform: rotate(-15deg);

            pointer-events: none;
        }


        /* ================= URANUS ================= */

        .uranus {

            width: 46px;
            height: 46px;

            background:
                radial-gradient(
                    circle at 30% 30%,
                    #baf4ff,
                    #4db6c9
                );

            box-shadow:
                0 0 20px #67e8f9;
        }


        /* ================= NEPTUNE ================= */

        .neptune {

            width: 46px;
            height: 46px;

            background:
                radial-gradient(
                    circle at 30% 30%,
                    #5b9cff,
                    #123b9e
                );

            box-shadow:
                0 0 22px #2563eb;
        }


        /* ================= INFO BOX ================= */

        .info {

            position: relative;

            width: 600px;

            max-width: 90%;

            margin: -10px auto 30px;

            padding: 22px;

            text-align: center;

            background:
                rgba(15, 23, 42, 0.96);

            border:
                1px solid #38bdf8;

            border-radius: 18px;

            box-shadow:
                0 0 30px
                rgba(56,189,248,0.3);

            z-index: 500;
        }


        .info h2 {

            color: #7dd3fc;

            font-size: 26px;

            margin-bottom: 10px;
        }


        .info p {

            color: #cbd5e1;

            font-size: 15px;

            line-height: 1.7;
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 850px) {

            .solar-system {

                transform: scale(0.75);

                transform-origin: top center;
            }

            .info {

                margin-top: -120px;

            }

        }

    </style>

</head>


<body>


    <!-- STARS -->

    <div class="stars"></div>


    <!-- BACK -->

    <button
        class="back-btn"
        onclick="goBack()">

        ← Dashboard

    </button>


    <!-- HEADER -->

    <header>

        <h1>🌌 COSMOX</h1>

        <p>
            Explore Our Solar System
        </p>

    </header>


    <!-- SOLAR SYSTEM -->

    <section class="solar-system">


        <!-- SUN -->

        <div
            class="sun"
            onclick="showPlanet('Sun')"
            title="Sun">
        </div>


        <!-- MERCURY -->

        <div class="orbit orbit1">

            <button
                class="planet mercury"
                onclick="showPlanet('Mercury')"
                title="Mercury">
            </button>

        </div>


        <!-- VENUS -->

        <div class="orbit orbit2">

            <button
                class="planet venus"
                onclick="showPlanet('Venus')"
                title="Venus">
            </button>

        </div>


        <!-- EARTH -->

        <div class="orbit orbit3">

            <button
                class="planet earth"
                onclick="showPlanet('Earth')"
                title="Earth">

                <img
                    src="https://images-assets.nasa.gov/image/PIA18033/PIA18033~orig.jpg"
                    alt="Earth">

            </button>

        </div>


        <!-- MARS -->

        <div class="orbit orbit4">

            <button
                class="planet mars"
                onclick="showPlanet('Mars')"
                title="Mars">
            </button>

        </div>


        <!-- JUPITER -->

        <div class="orbit orbit5">

            <button
                class="planet jupiter"
                onclick="showPlanet('Jupiter')"
                title="Jupiter">
            </button>

        </div>


        <!-- SATURN -->

        <div class="orbit orbit6">

            <button
                class="planet saturn"
                onclick="showPlanet('Saturn')"
                title="Saturn">
            </button>

        </div>


        <!-- URANUS -->

        <div class="orbit orbit7">

            <button
                class="planet uranus"
                onclick="showPlanet('Uranus')"
                title="Uranus">
            </button>

        </div>


        <!-- NEPTUNE -->

        <div class="orbit orbit8">

            <button
                class="planet neptune"
                onclick="showPlanet('Neptune')"
                title="Neptune">
            </button>

        </div>


    </section>


    <!-- INFORMATION -->

    <div class="info">

        <h2 id="planetName">
            Solar System
        </h2>

        <p id="planetInfo">
            Click any planet to see its details.
        </p>

    </div>


    <!-- JAVASCRIPT -->

    <script>


        const planets = {

            Sun:
            "The Sun is the star at the center of our Solar System. It provides light and heat to all the planets.",


            Mercury:
            "Mercury is the smallest planet in our Solar System and the closest planet to the Sun. It has a rocky surface and extreme temperature changes.",


            Venus:
            "Venus is the second planet from the Sun. It has a thick atmosphere and is the hottest planet in our Solar System.",


            Earth:
            "Earth is the third planet from the Sun. It is our home planet and the only known planet that supports life.",


            Mars:
            "Mars is the fourth planet from the Sun. It is called the Red Planet because of iron minerals on its surface.",


            Jupiter:
            "Jupiter is the largest planet in our Solar System. It is a gas giant and is famous for its Great Red Spot.",


            Saturn:
            "Saturn is the sixth planet from the Sun. It is a gas giant famous for its beautiful ring system.",


            Uranus:
            "Uranus is the seventh planet from the Sun. It is an ice giant and rotates on its side.",


            Neptune:
            "Neptune is the eighth and farthest planet from the Sun. It is a cold blue ice giant with extremely strong winds."

        };


        /* SHOW PLANET DETAILS */

        function showPlanet(name) {

            document.getElementById("planetName").innerText = name;

            document.getElementById("planetInfo").innerText =
                planets[name];

        }


        /* BACK TO DASHBOARD */

        function goBack() {

            window.location.href = "dashboard.html";

        }


    </script>


</body>

</html>
