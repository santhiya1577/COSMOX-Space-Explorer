<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> COSMOX</title>
    <link rel="stylesheet" href="style.css">
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            color: white;
            background: #020617;
            overflow: hidden;
        }

        /* MAIN SPACE */

        .space {
            height: 100vh;
            width: 100%;

            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    rgba(2, 6, 23, 0.35),
                    rgba(2, 6, 23, 0.85)
                ),
                url("https://images-assets.nasa.gov/image/PIA12348/PIA12348~orig.jpg");

            background-size: cover;
            background-position: center;
        }

        /* STARS */

        .stars {
            position: absolute;
            inset: 0;

            background-image:
                radial-gradient(2px 2px at 10% 20%, white, transparent),
                radial-gradient(1px 1px at 25% 70%, white, transparent),
                radial-gradient(2px 2px at 40% 30%, white, transparent),
                radial-gradient(1px 1px at 60% 80%, white, transparent),
                radial-gradient(2px 2px at 75% 20%, white, transparent),
                radial-gradient(1px 1px at 90% 60%, white, transparent);

            animation: stars 8s infinite alternate;
        }

        @keyframes stars {

            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.08);
            }
        }

        /* ROCKET */

        .rocket {

            position: absolute;

            top: 20%;
            right: 12%;

            font-size: 65px;

            animation: rocketMove 5s ease-in-out infinite;

            filter:
                drop-shadow(0 0 15px #38bdf8);
        }

        @keyframes rocketMove {

            0% {
                transform:
                    translate(0, 0)
                    rotate(-15deg);
            }

            50% {
                transform:
                    translate(-100px, 80px)
                    rotate(10deg);
            }

            100% {
                transform:
                    translate(0, 0)
                    rotate(-15deg);
            }
        }

        /* CONTENT */

        .content {

            position: relative;

            z-index: 5;

            text-align: center;

            width: 90%;
        }

        /* LOGO */

        .logo {

            font-size: 70px;

            font-weight: bold;

            letter-spacing: 12px;

            color: #38bdf8;

            text-shadow:
                0 0 10px #38bdf8,
                0 0 30px #2563eb,
                0 0 60px #1d4ed8;

            animation: glow 2s infinite alternate;
        }

        @keyframes glow {

            from {
                opacity: 0.75;
            }

            to {
                opacity: 1;
            }
        }

        .subtitle {

            margin-top: 10px;

            font-size: 18px;

            letter-spacing: 5px;

            color: #cbd5e1;
        }

        /* EARTH */

        .earth {

            width: 180px;
            height: 180px;

            margin: 35px auto;

            border-radius: 50%;

            overflow: hidden;

            border: 2px solid rgba(56, 189, 248, 0.5);

            box-shadow:
                0 0 30px #38bdf8,
                0 0 70px rgba(37, 99, 235, 0.7);

            animation: earthFloat 4s ease-in-out infinite;
        }

        .earth img {

            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        @keyframes earthFloat {

            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }

            100% {
                transform: translateY(0);
            }
        }

        /* BUTTON */

        .enter-btn {

            padding: 15px 35px;

            border: 1px solid #38bdf8;

            border-radius: 30px;

            background: rgba(56, 189, 248, 0.12);

            color: white;

            font-size: 16px;

            letter-spacing: 2px;

            cursor: pointer;

            transition: 0.3s;
        }

        .enter-btn:hover {

            background: #0284c7;

            transform: scale(1.08);

            box-shadow:
                0 0 20px #38bdf8,
                0 0 50px #2563eb;
        }

        /* LOADING */

        .loading {

            margin-top: 25px;

            color: #94a3b8;

            font-size: 14px;
        }

        .bar {

            width: 250px;

            height: 5px;

            margin: 10px auto;

            background: #1e293b;

            border-radius: 10px;

            overflow: hidden;
        }

        .progress {

            width: 0%;

            height: 100%;

            background: #38bdf8;

            box-shadow: 0 0 15px #38bdf8;
        }

        /* MOBILE */

        @media(max-width: 600px) {

            .logo {
                font-size: 42px;
                letter-spacing: 6px;
            }

            .subtitle {
                font-size: 12px;
            }

            .earth {
                width: 140px;
                height: 140px;
            }

            .rocket {
                font-size: 40px;
                right: 5%;
            }

        }

    </style>
</head>


<body>

<div class="space">

    <!-- STARS -->

    <div class="stars"></div>


    <!-- ROCKET -->

    <div class="rocket">
        🚀
    </div>


    <!-- CONTENT -->

    <div class="content">

        <div class="logo">
            COSMOX
        </div>

        <div class="subtitle">
            SANDHIYA ULTIMATE SPACE EXPLORER
        </div>


        <!-- EARTH IMAGE -->

        <div class="earth">

            <img
                src="https://images-assets.nasa.gov/image/PIA18033/PIA18033~orig.jpg"
                alt="Earth"
            >

        </div>


        <!-- ENTER BUTTON -->

        <button
            class="enter-btn"
            onclick="enterUniverse()"
        >
            🚀 ENTER THE UNIVERSE
        </button>


        <!-- LOADING -->

        <div class="loading">

            SYSTEM INITIALIZING...

            <span id="percent">
                0%
            </span>

            <div class="bar">

                <div
                    class="progress"
                    id="progress"
                ></div>

            </div>

        </div>

    </div>

</div>


<script>

    /* LOADING ANIMATION */

    let progress = 0;

    const loading = setInterval(function() {

        progress++;

        document.getElementById("percent").innerText =
            progress + "%";

        document.getElementById("progress").style.width =
            progress + "%";


        if (progress >= 100) {

            clearInterval(loading);

        }

    }, 30);


    /* ENTER UNIVERSE */

    function enterUniverse() {

        if (progress < 100) {

            alert(
                "🚀 Please wait! Universe is initializing..."
            );

        } else {

            window.location.href =
                "profile.html";

        }

    }

</script>
<script src="script.js"></script>
</body>

</html>
